AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Create Event Attendees

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  CreateEventAttendeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub createEventAttendees-${Environment}
      Handler: dist/createEventAttendees.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        CreateEventAttendeesApi:
          Type: Api
          Properties:
            Path: /event-attendees
            Method: POST

Outputs:
  CreateEventAttendeesFunctionArn:
    Description: ARN of the Create Event Attendees Lambda function
    Value: !GetAtt CreateEventAttendeesFunction.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/event-attendees
