AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Delete Calendar

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  DeleteCalendar:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deleteCalendar-${Environment}
      Handler: dist/deleteCalendar.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        DeleteCalendarApi:
          Type: Api
          Properties:
            Path: /calendars/{id}
            Method: DELETE

Outputs:
  DeleteCalendarFunctionArn:
    Description: ARN of the Delete Calendar Lambda function
    Value: !GetAtt DeleteCalendar.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/calendars/{id}
