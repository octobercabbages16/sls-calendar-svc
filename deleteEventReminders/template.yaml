AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Delete Event Reminders

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  DeleteEventReminders:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deleteEventReminders-${Environment}
      Handler: dist/deleteEventReminders.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        DeleteEventRemindersApi:
          Type: Api
          Properties:
            Path: /event-reminders/{id}
            Method: DELETE

Outputs:
  DeleteEventRemindersFunctionArn:
    Description: ARN of the Delete Event Reminders Lambda function
    Value: !GetAtt DeleteEventReminders.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/event-reminders/{id}
