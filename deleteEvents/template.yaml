AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Delete Events

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  DeleteEvents:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deleteEvents-${Environment}
      Handler: dist/deleteEvents.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        DeleteEventsApi:
          Type: Api
          Properties:
            Path: /events/{id}
            Method: DELETE

Outputs:
  DeleteEventsFunctionArn:
    Description: ARN of the Delete Events Lambda function
    Value: !GetAtt DeleteEvents.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/events/{id}
