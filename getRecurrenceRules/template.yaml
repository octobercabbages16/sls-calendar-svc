AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Get Recurrence Rules

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  GetRecurrenceRules:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub getRecurrenceRules-${Environment}
      Handler: dist/getRecurrenceRules.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        GetRecurrenceRulesApi:
          Type: Api
          Properties:
            Path: /events/{event_id}/recurrence-rules
            Method: GET

Outputs:
  GetRecurrenceRulesFunctionArn:
    Description: ARN of the Get Recurrence Rules Lambda function
    Value: !GetAtt GetRecurrenceRules.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/events/{event_id}/recurrence-rules
