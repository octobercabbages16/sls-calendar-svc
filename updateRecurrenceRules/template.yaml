AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Update Recurrence Rules

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  UpdateRecurrenceRules:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub updateRecurrenceRules-${Environment}
      Handler: dist/updateRecurrenceRules.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        UpdateRecurrenceRulesApi:
          Type: Api
          Properties:
            Path: /recurrence-rules/{id}
            Method: PUT

Outputs:
  UpdateRecurrenceRulesFunctionArn:
    Description: ARN of the Update Recurrence Rules Lambda function
    Value: !GetAtt UpdateRecurrenceRules.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/recurrence-rules/{id}
