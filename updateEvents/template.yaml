AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Update Events

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  UpdateEvents:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub updateEvents-${Environment}
      Handler: dist/updateEvents.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        UpdateEventsApi:
          Type: Api
          Properties:
            Path: /events/{id}
            Method: PUT

Outputs:
  UpdateEventsFunctionArn:
    Description: ARN of the Update Events Lambda function
    Value: !GetAtt UpdateEvents.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/events/{id}
