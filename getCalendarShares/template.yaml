AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Get Calendar Shares

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  GetCalendarShares:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub getCalendarShares-${Environment}
      Handler: dist/getCalendarShares.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        GetCalendarSharesApi:
          Type: Api
          Properties:
            Path: /calendars/{calendar_id}/shares
            Method: GET

Outputs:
  GetCalendarSharesFunctionArn:
    Description: ARN of the Get Calendar Shares Lambda function
    Value: !GetAtt GetCalendarShares.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/calendars/{calendar_id}/shares
