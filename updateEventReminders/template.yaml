AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Calendar Service - Update Event Reminders

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret for DB credentials

Resources:
  UpdateEventReminders:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub updateEventReminders-${Environment}
      Handler: dist/updateEventReminders.handler
      CodeUri: ./
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*
      Events:
        UpdateEventRemindersApi:
          Type: Api
          Properties:
            Path: /event-reminders/{id}
            Method: PUT

Outputs:
  UpdateEventRemindersFunctionArn:
    Description: ARN of the Update Event Reminders Lambda function
    Value: !GetAtt UpdateEventReminders.Arn
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/event-reminders/{id}
